server:
  port: 8080

spring:
  application:
    name: arogion-api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: patient-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/patients/**